name: git hosted workflow

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
        
jobs:
  pre-build:
    env:
      LEVEL: "pre"
      TAGS: "tagtest = true"
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Run a one-line script
        run: |
          echo this is the pre build!
          sleep 15
          echo Goodbye!
  build:
    env:
      LEVEL: "during"
      TAGS: "tagtest = true"
      
    needs: pre-build
    
    runs-on:
      - windows-latest
    steps:
      - uses: actions/checkout@v2

      - name: Run a one-line script
        run: |
          echo this is the build!
          sleep 15
          echo Ok!

  post-build:
    env:
      LEVEL: "post"
      TAGS: "tagtest = true"
    needs: build
    
    runs-on:
      - macos-latest
    steps:
      - uses: actions/checkout@v2

      - name: Run a one-line script
        run: |
          echo this is the post-build!
          sleep 15
          echo we are done!

     
